<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrankGuard — nouveau périphérique</title>
  <link rel="stylesheet" href="prompt.css">
</head>
<body>
  <main class="card" id="card">
    <header class="pywebview-drag-region">
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg></div>
      <div>
        <h1>Nouveau périphérique</h1>
        <p id="kb" class="kb" hidden>Clavier bloqué jusqu'à votre réponse</p>
      </div>
      <div class="timer"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" class="bg"/><circle cx="20" cy="20" r="17" class="fg" id="arc"/></svg><span id="left">5</span></div>
    </header>
    <ul id="devices"></ul>
    <p class="hint">Sans réponse, la session sera verrouillée et le périphérique éjecté.</p>
    <div class="actions">
      <button class="deny" data-d="deny">Refuser et verrouiller</button>
      <button class="once" data-d="once">Autoriser cette fois</button>
      <button class="always" data-d="always">Toujours autoriser</button>
    </div>
  </main>
  <script src="prompt.js"></script>
</body>
</html>
